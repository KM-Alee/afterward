[project]
name = "afterward"
version = "0.0.1"
description = "Afterward hackathon repository and agent workflow"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2.1", "psycopg[binary]>=3.3",
  "pydantic>=2", "httpx", "openai==3.31.0", "google-api-python-client",
  "google-auth", "google-auth-oauthlib", "cryptography", "python-multipart", "jinja2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pre-commit"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"
markers = [
  "db: requires real PostgreSQL; request db_engine or db_connection",
  "network: live external service test; opt in with --live (excluded from CI)",
  "slow: expensive test excluded by test-fast",
]
