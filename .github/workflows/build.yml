name: Versioned image
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: afterward
          POSTGRES_DB: afterward_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afterward -d afterward_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_TEST: postgresql+psycopg://afterward@127.0.0.1:5432/afterward_test
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: make ci
      - run: |
          make requirements
          git diff --exit-code -- requirements.txt
      - name: Secret scan before publishing
        run: |
          mkdir -p "$RUNNER_TEMP/afterward-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/afterward-scan"
          docker run --rm -v "$RUNNER_TEMP/afterward-scan:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable release tag
        id: image
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH with optional prerelease; refusing image push.' >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/afterward:$release" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
