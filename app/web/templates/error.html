{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}{{ status_code }} · Afterward{% endblock %}
{% block body_mode %}app{% endblock %}
{% block main %}
<div class="wrap wrap--narrow page">
  <div class="empty empty--card empty--hero rise">
    <svg class="empty__art" viewBox="2 14 60 36" aria-hidden="true"><path d="M16.03 38.19A17 17 0 0 1 47.97 38.19M11.69 30.3A24.5 24.5 0 0 1 19.75 22.78M26.49 20.13A24.5 24.5 0 0 1 37.51 20.13M44.25 22.78A24.5 24.5 0 0 1 52.31 30.3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M21 44A11 11 0 0 1 43 44Z" fill="var(--c-dawn)"/><path d="M8 44H56" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    <p class="eyebrow">Error {{ status_code }}</p>
    <p class="empty__title">{{ message }}</p>
    <p><a class="btn btn--primary" href="/">{{ ui.icon('arrow-left') }}Back to the start</a></p>
  </div>
</div>
{% endblock %}
