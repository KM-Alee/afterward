name: afterward-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: afterward
      POSTGRES_DB: afterward
      # Local loopback only; no development credentials to copy into production.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${AFTERWARD_PG_PORT:-5432}:5432"
    volumes:
      - afterward_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterward -d afterward"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  afterward_pg:
